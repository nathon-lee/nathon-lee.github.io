<!-- Visitors Section -->
<!-- 👇 把 globe.gl 脚本移到这里，容器先渲染 -->
<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>

<script>
const world = Globe()
  (document.getElementById('globeViz'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .width(400)  // 👇 强制指定画布宽高，和容器一致
  .height(300);

// 🌍 country → lat/lng
const countryLatLng = {
  US: [37.0902, -95.7129],
  CN: [35.8617, 104.1954],
  IN: [20.5937, 78.9629],
  GB: [55.3781, -3.4360],
  DE: [51.1657, 10.4515],
  FR: [46.2276, 2.2137],
  JP: [36.2048, 138.2529],
  KR: [35.9078, 127.7669],
  CA: [56.1304, -106.3468],
  AU: [-25.2744, 133.7751]
};

// 🌐 GoatCounter 数据抓取
async function fetchData() {
  try {
    const res = await fetch("https://YOURNAME.goatcounter.com/countries");
    const text = await res.text();
    const matches = [...text.matchAll(/([A-Z]{2}).*?(\d+)/g)];
    return matches.map(m => ({
      country: m[1],
      count: parseInt(m[2])
    }));
  } catch (e) {
    console.log("fallback demo mode");
    return [
      { country: "US", count: 10 },
      { country: "CN", count: 6 },
      { country: "JP", count: 4 }
    ];
  }
}

// 🌍 转 globe 点
function toPoints(stats) {
  return stats
    .filter(d => countryLatLng[d.country])
    .map(d => ({
      lat: countryLatLng[d.country][0],
      lng: countryLatLng[d.country][1],
      size: Math.log(d.count + 1) * 0.25,
      color: "orange",
      label: `${d.country}: ${d.count}`
    }));
}

async function init() {
  const stats = await fetchData();
  const points = toPoints(stats);
  world
    .pointsData(points)
    .pointAltitude('size')
    .pointColor('color')
    .pointLabel(d => d.label);
}

// 👇 等 DOM 完全加载再初始化，避免容器还没渲染
window.addEventListener('DOMContentLoaded', init);
</script>

<tr>
  <td style="padding:16px;width:100%;vertical-align:middle">
